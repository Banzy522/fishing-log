<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釣果ログ">
<meta name="theme-color" content="#0d1f14">
<title>釣果ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d1f14;
  --ink-mid: #1a3a24;
  --moss: #2d6a4f;
  --reed: #52b788;
  --mist: #d8f3dc;
  --water: #b7e4c7;
  --sand: #f5f0e8;
  --warm: #fefae0;
  --amber: #e9c46a;
  --terracotta: #c77d32;
  --text: #1a1a1a;
  --text-mid: #4a5a4e;
  --text-light: #8a9e8f;
  --border: rgba(45,106,79,0.15);
  --border-strong: rgba(45,106,79,0.3);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);overscroll-behavior:none}

.shell{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:var(--sand);position:relative;overflow:hidden}

/* Header */
.hdr{
  background:var(--ink);
  padding:calc(var(--safe-top) + 10px) 20px 12px;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 50%, rgba(82,183,136,0.18) 0%, transparent 60%);
}
.hdr-inner{display:flex;align-items:center;gap:12px;position:relative}
.logo{
  width:38px;height:38px;background:var(--moss);border-radius:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 12px rgba(82,183,136,0.4);
}
.logo svg{width:22px;height:22px}
.hdr-text h1{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:700;color:#fff;letter-spacing:0.04em}
.hdr-text p{font-size:11px;color:var(--reed);letter-spacing:0.08em;margin-top:1px}
.hdr-badge{
  margin-left:auto;background:rgba(82,183,136,0.2);border:0.5px solid rgba(82,183,136,0.4);
  color:var(--reed);font-size:11px;padding:4px 12px;border-radius:20px;font-weight:500;
  white-space:nowrap;
}
.sync-dot{
  width:6px;height:6px;border-radius:50%;background:var(--reed);
  display:inline-block;margin-right:5px;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Tabs */
.tabs{
  background:var(--ink);padding:0 16px 14px;display:flex;gap:6px;flex-shrink:0;
}
.tab{
  flex:1;padding:9px 0;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:500;
  font-family:'Zen Kaku Gothic New',sans-serif;cursor:pointer;transition:all 0.2s;
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.45);
}
.tab.on{background:var(--moss);color:#fff;box-shadow:0 2px 10px rgba(45,106,79,0.5)}

/* Content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--sand)}
.view{display:none;padding:14px 14px 0}
.view.on{display:block}

/* Cards */
.card{
  background:#fff;border-radius:var(--r-lg);padding:16px;margin-bottom:12px;
  border:0.5px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.card-title{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--moss);margin-bottom:13px;display:flex;align-items:center;gap:6px;
}
.card-title svg{width:12px;height:12px;stroke:var(--moss)}

/* Fields */
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:11px;color:var(--text-light);margin-bottom:4px;font-weight:500;letter-spacing:0.03em}
.f input,.f select,.f textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;background:#fafafa;
  color:var(--text);outline:none;-webkit-appearance:none;transition:border-color 0.15s,background 0.15s;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--moss);background:#fff}
.f textarea{resize:vertical;min-height:80px;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Toggle chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border:1px solid var(--border-strong);border-radius:20px;
  font-size:12px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;
  background:#fff;color:var(--text-mid);cursor:pointer;transition:all 0.15s;
  white-space:nowrap;
}
.chip.g{background:var(--mist);border-color:var(--moss);color:var(--moss)}
.chip.b{background:#e8f4fd;border-color:#2980b9;color:#1a6a9a}

/* Photo */
.photo-drop{
  border:2px dashed var(--border-strong);border-radius:var(--r-md);padding:22px;
  text-align:center;cursor:pointer;position:relative;overflow:hidden;
  transition:all 0.2s;background:#fafafa;
}
.photo-drop:hover{border-color:var(--moss);background:var(--mist)}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-drop svg{width:28px;height:28px;stroke:#bbb;margin:0 auto 8px;display:block}
.photo-drop p{font-size:13px;color:#aaa}
.photo-drop small{font-size:11px;color:#ccc;margin-top:3px;display:block}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border)}
.photo-more{
  aspect-ratio:1;border:2px dashed var(--border-strong);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  position:relative;background:#fafafa;font-size:24px;color:#bbb;
}
.photo-more input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* Save btn */
.save-btn{
  width:100%;padding:15px;background:var(--moss);color:#fff;border:none;
  border-radius:var(--r-md);font-size:15px;font-weight:700;
  font-family:'Shippori Mincho',serif;letter-spacing:0.06em;
  cursor:pointer;margin:4px 0 0;transition:all 0.15s;
  box-shadow:0 4px 16px rgba(45,106,79,0.4);
}
.save-btn:active{transform:scale(0.98);background:var(--ink-mid)}

/* Record cards */
.rec{
  background:#fff;border-radius:var(--r-lg);margin-bottom:10px;
  border:0.5px solid var(--border);overflow:hidden;cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.rec:active{transform:scale(0.99)}
.rec-img{width:100%;height:170px;object-fit:cover;display:block}
.rec-img-placeholder{
  width:100%;height:60px;background:linear-gradient(135deg,var(--mist),var(--water));
  display:flex;align-items:center;justify-content:center;
}
.rec-img-placeholder svg{width:28px;height:28px;stroke:var(--moss);opacity:0.5}
.rec-body{padding:13px 15px}
.rec-fish{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:2px}
.rec-size{font-size:12px;color:var(--text-light);margin-bottom:9px}
.rec-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.tg{background:var(--mist);color:var(--moss)}
.tb{background:#e8f4fd;color:#1a6a9a}
.ta{background:#fff8e6;color:#8a6200}
.rec-meta{font-size:12px;color:var(--text-light)}
.rec-tackle{font-size:12px;color:var(--text-mid);margin-top:7px;padding-top:7px;border-top:1px solid var(--border);line-height:1.7}
.rec-memo{font-size:12px;color:#888;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);line-height:1.6}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#bbb}
.empty svg{width:52px;height:52px;stroke:#ddd;margin:0 auto 12px;display:block}
.empty p{font-size:14px;color:#aaa;margin-bottom:4px}
.empty small{font-size:12px;color:#ccc}

/* Detail sheet */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:300;
  align-items:flex-end;justify-content:center;
}
.overlay.on{display:flex}
.sheet{
  background:var(--sand);border-radius:24px 24px 0 0;width:100%;max-width:430px;
  max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 20px calc(var(--safe-bottom) + 20px);
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.sheet-close{
  float:right;background:#f0f0f0;border:none;width:28px;height:28px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#777;cursor:pointer;
}
.sheet-fish{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:3px;padding-right:36px}
.sheet-sub{font-size:12px;color:var(--text-light);margin-bottom:12px}
.sheet-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:14px}
.sheet-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm)}
.sheet-sec{font-size:10px;color:#aaa;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 6px}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:0.5px solid var(--border)}
.drow:last-child{border-bottom:none}
.dlabel{font-size:12px;color:var(--text-light)}
.dval{font-size:13px;font-weight:500;color:var(--ink);text-align:right;max-width:60%}
.del-btn{
  width:100%;padding:12px;background:#fff0f0;color:#c0392b;
  border:1px solid #ffd5d5;border-radius:var(--r-md);font-size:14px;
  font-family:'Zen Kaku Gothic New',sans-serif;cursor:pointer;margin-top:16px;font-weight:500;
}

/* Toast */
.toast{
  position:fixed;bottom:calc(var(--safe-bottom) + 16px);left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:500;white-space:nowrap;
  opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;z-index:999;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{
  position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:500;transition:opacity 0.4s;
}
.loading.hide{opacity:0;pointer-events:none}
.loading-logo{width:60px;height:60px;background:var(--moss);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 4px 20px rgba(82,183,136,0.5)}
.loading-logo svg{width:36px;height:36px}
.loading h2{font-family:'Shippori Mincho',serif;color:#fff;font-size:20px;margin-bottom:8px}
.loading p{color:var(--reed);font-size:13px}
.spinner{width:24px;height:24px;border:2px solid rgba(82,183,136,0.3);border-top-color:var(--reed);border-radius:50%;animation:spin 0.8s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}

.pad{height:calc(var(--safe-bottom) + 20px)}
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading" id="loading">
  <div class="loading-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 3.5-.8 8.5 2.27 11.5C7 16 7 13.33 7 12z"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/></svg>
  </div>
  <h2>釣果ログ</h2>
  <p>クラウドに接続中...</p>
  <div class="spinner"></div>
</div>

<div class="shell">
  <div class="hdr">
    <div class="hdr-inner">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 3.5-.8 8.5 2.27 11.5C7 16 7 13.33 7 12z"/></svg>
      </div>
      <div class="hdr-text">
        <h1>釣果ログ</h1>
        <p>FISHING RECORD</p>
      </div>
      <div class="hdr-badge"><span class="sync-dot"></span><span id="rec-count">0件</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="switchTab('form',this)">＋ 新しい記録</button>
    <button class="tab" onclick="switchTab('list',this)">記録一覧</button>
  </div>

  <div class="content">

    <!-- Form -->
    <div class="view on" id="view-form">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          日時・場所
        </div>
        <div class="g2" style="margin-bottom:10px">
          <div class="f"><label>日付</label><input type="date" id="f-date"></div>
          <div class="f"><label>時刻</label><input type="time" id="f-time"></div>
        </div>
        <div class="f"><label>釣り場</label><input type="text" id="f-loc" placeholder="例：東京湾・相模川・霞ヶ浦"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20"/><path d="M12 6v6l4 2"/></svg>
          天気・気象
        </div>
        <div class="f" style="margin-bottom:10px">
          <label>天気</label>
          <div class="chips" id="wg">
            <button class="chip" onclick="sel(this,'wg','g')">☀ 晴れ</button>
            <button class="chip" onclick="sel(this,'wg','g')">⛅ 晴曇</button>
            <button class="chip" onclick="sel(this,'wg','g')">☁ 曇り</button>
            <button class="chip" onclick="sel(this,'wg','g')">🌧 雨</button>
            <button class="chip" onclick="sel(this,'wg','g')">💨 強風</button>
          </div>
        </div>
        <div class="g2">
          <div class="f"><label>気温 (°C)</label><input type="number" id="f-temp" placeholder="22"></div>
          <div class="f"><label>風速 (m/s)</label><input type="number" id="f-wind" placeholder="3"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12c-2.67 4-5.33 6-8 6-4 0-8-4-8-6s4-6 8-6c2.67 0 5.33 2 8 6z"/></svg>
          潮目・潮汐
        </div>
        <div class="f" style="margin-bottom:10px">
          <label>潮回り</label>
          <div class="chips" id="tg">
            <button class="chip" onclick="sel(this,'tg','b')">大潮</button>
            <button class="chip" onclick="sel(this,'tg','b')">中潮</button>
            <button class="chip" onclick="sel(this,'tg','b')">小潮</button>
            <button class="chip" onclick="sel(this,'tg','b')">長潮</button>
            <button class="chip" onclick="sel(this,'tg','b')">若潮</button>
          </div>
        </div>
        <div class="g2">
          <div class="f"><label>満潮</label><input type="time" id="f-hi"></div>
          <div class="f"><label>干潮</label><input type="time" id="f-lo"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          タックル
        </div>
        <div class="g2">
          <div class="f"><label>ロッド</label><input type="text" id="f-rod" placeholder="例：ダイワ EMC-86M"></div>
          <div class="f"><label>リール</label><input type="text" id="f-reel" placeholder="例：ヴァンキッシュ 2500"></div>
        </div>
        <div class="g2">
          <div class="f"><label>ライン</label><input type="text" id="f-line" placeholder="例：PE 0.8号"></div>
          <div class="f"><label>ルアー</label><input type="text" id="f-lure" placeholder="例：X-80"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/></svg>
          釣果
        </div>
        <div class="g3">
          <div class="f"><label>魚種</label><input type="text" id="f-fish" placeholder="シーバス"></div>
          <div class="f"><label>サイズ(cm)</label><input type="number" id="f-size" placeholder="68"></div>
          <div class="f"><label>重量(g)</label><input type="number" id="f-wt" placeholder="2800"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          写真
        </div>
        <div class="photo-drop" id="pdrop">
          <input type="file" accept="image/*" multiple onchange="addPhotos(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>タップして写真を追加</p>
          <small>複数枚選択可・自動圧縮</small>
        </div>
        <div class="photo-grid" id="pgrid" style="display:none"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          備考
        </div>
        <div class="f">
          <textarea id="f-memo" placeholder="ヒットパターン・ポイント詳細・次回の改善点など..."></textarea>
        </div>
      </div>

      <button class="save-btn" onclick="saveRecord()">　釣果を記録する　</button>
      <div class="pad"></div>
    </div>

    <!-- List -->
    <div class="view" id="view-list">
      <div id="rec-list">
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 3.5-.8 8.5 2.27 11.5C7 16 7 13.33 7 12z"/></svg>
          <p>まだ記録がありません</p>
          <small>「新しい記録」から入力してください</small>
        </div>
      </div>
      <div class="pad"></div>
    </div>

  </div>
</div>

<!-- Detail -->
<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAy_PTxm-0aRmb_dF1lg1rLXM2X2zQzYHg",
  authDomain: "fishing-log-7ca41.firebaseapp.com",
  projectId: "fishing-log-7ca41",
  storageBucket: "fishing-log-7ca41.firebasestorage.app",
  messagingSenderId: "654443344040",
  appId: "1:654443344040:web:0603dc0072442282ce529d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'records';

// State
let records = [];
let photos = [];
let selWeather = '';
let selTide = '';

// Init date/time
const now = new Date();
document.getElementById('f-date').value = now.toISOString().split('T')[0];
document.getElementById('f-time').value =
  String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

// Load records from Firestore
const q = query(collection(db, COL), orderBy('createdAt','desc'));
onSnapshot(q, snap => {
  records = snap.docs.map(d => ({id: d.id, ...d.data()}));
  document.getElementById('rec-count').textContent = records.length + '件';
  renderList();
  document.getElementById('loading').classList.add('hide');
  setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
}, err => {
  console.error(err);
  toast('接続エラー。ページを再読み込みしてください');
  document.getElementById('loading').classList.add('hide');
});

// Expose globals
window.switchTab = (tab, btn) => {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.getElementById('view-'+tab).classList.add('on');
};

window.sel = (btn, gid, cls) => {
  const was = btn.classList.contains(cls);
  document.getElementById(gid).querySelectorAll('.chip').forEach(b => b.className='chip');
  if (!was) {
    btn.classList.add(cls);
    const txt = btn.textContent.trim().replace(/^.\s/,'');
    if (gid==='wg') selWeather = txt;
    if (gid==='tg') selTide = txt;
  } else {
    if (gid==='wg') selWeather='';
    if (gid==='tg') selTide='';
  }
};

window.addPhotos = (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  document.getElementById('pdrop').style.display = 'none';
  document.getElementById('pgrid').style.display = 'grid';
  files.forEach(f => {
    compressImage(f, b64 => {
      photos.push(b64);
      renderPhotoGrid();
    });
  });
};

function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let {width:w, height:h} = img;
      if (w > h && w > MAX) { h = h*MAX/w; w = MAX; }
      else if (h > MAX) { w = w*MAX/h; h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPhotoGrid() {
  const grid = document.getElementById('pgrid');
  grid.innerHTML = photos.map(p => `<img src="${p}">`).join('') +
    `<div class="photo-more">+<input type="file" accept="image/*" multiple onchange="addPhotos(event)"></div>`;
}

window.saveRecord = async () => {
  const fish = document.getElementById('f-fish').value.trim();
  const date = document.getElementById('f-date').value;
  if (!date || !fish) { toast('⚠ 日付と魚種は必須です'); return; }
  const rec = {
    date, time: document.getElementById('f-time').value,
    location: document.getElementById('f-loc').value,
    weather: selWeather,
    temp: document.getElementById('f-temp').value,
    wind: document.getElementById('f-wind').value,
    tide: selTide,
    hightide: document.getElementById('f-hi').value,
    lowtide: document.getElementById('f-lo').value,
    rod: document.getElementById('f-rod').value,
    reel: document.getElementById('f-reel').value,
    line: document.getElementById('f-line').value,
    lure: document.getElementById('f-lure').value,
    fish, size: document.getElementById('f-size').value,
    weight: document.getElementById('f-wt').value,
    memo: document.getElementById('f-memo').value,
    photos: [...photos],
    createdAt: Date.now()
  };
  try {
    toast('保存中...');
    await addDoc(collection(db, COL), rec);
    resetForm();
    toast('✓ 記録をクラウドに保存しました');
    setTimeout(() => {
      const tabs = document.querySelectorAll('.tab');
      switchTab('list', tabs[1]);
    }, 600);
  } catch(e) {
    toast('保存エラー: ' + e.message);
  }
};

function resetForm() {
  ['f-loc','f-temp','f-wind','f-hi','f-lo','f-rod','f-reel','f-line','f-lure','f-fish','f-size','f-wt','f-memo']
    .forEach(id => document.getElementById(id).value = '');
  selWeather=''; selTide='';
  document.querySelectorAll('.chip').forEach(b => b.className='chip');
  photos = [];
  document.getElementById('pgrid').innerHTML='';
  document.getElementById('pgrid').style.display='none';
  document.getElementById('pdrop').style.display='block';
  const n = new Date();
  document.getElementById('f-date').value = n.toISOString().split('T')[0];
}

function renderList() {
  const el = document.getElementById('rec-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 3.5-.8 8.5 2.27 11.5C7 16 7 13.33 7 12z"/></svg><p>まだ記録がありません</p><small>「新しい記録」から入力してください</small></div>`;
    return;
  }
  el.innerHTML = records.map(r => {
    const detail = [r.size?r.size+'cm':'', r.weight?r.weight+'g':''].filter(Boolean).join(' / ');
    const ph = r.photos&&r.photos.length ? `<img class="rec-img" src="${r.photos[0]}">` :
      `<div class="rec-img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6z"/></svg></div>`;
    const tackle = [r.rod,r.reel,r.line,r.lure].filter(Boolean).join('　');
    return `<div class="rec" onclick="openDetail('${r.id}')">
      ${ph}
      <div class="rec-body">
        <div class="rec-fish">${r.fish}</div>
        ${detail?`<div class="rec-size">${detail}</div>`:'<div style="height:6px"></div>'}
        <div class="rec-tags">
          ${r.weather?`<span class="tag tg">${r.weather}</span>`:''}
          ${r.tide?`<span class="tag tb">${r.tide}</span>`:''}
          ${r.lure?`<span class="tag ta">${r.lure}</span>`:''}
        </div>
        <div class="rec-meta">${r.date}${r.time?' '+r.time:''}${r.location?' · '+r.location:''}</div>
        ${tackle?`<div class="rec-tackle">${tackle}</div>`:''}
        ${r.memo?`<div class="rec-memo">${r.memo.replace(/\n/g,'<br>')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

window.openDetail = (id) => {
  const r = records.find(x => x.id===id);
  if (!r) return;
  const rows = [
    ['魚種',r.fish],['サイズ',r.size?r.size+' cm':'—'],['重量',r.weight?r.weight+' g':'—'],
    ['日付',r.date+(r.time?' '+r.time:'')],['釣り場',r.location||'—'],
    ['天気',r.weather||'—'],['気温',r.temp?r.temp+'°C':'—'],['風速',r.wind?r.wind+' m/s':'—'],
    ['潮回り',r.tide||'—'],['満潮',r.hightide||'—'],['干潮',r.lowtide||'—'],
    ['ロッド',r.rod||'—'],['リール',r.reel||'—'],['ライン',r.line||'—'],['ルアー',r.lure||'—'],
  ];
  const ph = r.photos&&r.photos.length ?
    `<div class="sheet-photos">${r.photos.map(p=>`<img src="${p}">`).join('')}</div>` : '';
  document.getElementById('sheet-content').innerHTML = `
    <button class="sheet-close" onclick="closeSheet(null)">✕</button>
    <div class="sheet-fish">${r.fish}</div>
    <div class="sheet-sub">${r.date}${r.location?' · '+r.location:''}</div>
    ${ph}
    <div class="sheet-sec">詳細</div>
    ${rows.map(([l,v])=>`<div class="drow"><span class="dlabel">${l}</span><span class="dval">${v}</span></div>`).join('')}
    ${r.memo?`<div class="sheet-sec">備考</div><div style="font-size:13px;color:#555;line-height:1.7">${r.memo.replace(/\n/g,'<br>')}</div>`:''}
    <button class="del-btn" onclick="deleteRecord('${r.id}')">この記録を削除する</button>
    <div style="height:8px"></div>
  `;
  document.getElementById('overlay').classList.add('on');
};

window.closeSheet = (e) => {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('on');
};

window.deleteRecord = async (id) => {
  if (!confirm('この記録を削除しますか？')) return;
  await deleteDoc(doc(db, COL, id));
  closeSheet(null);
  toast('削除しました');
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 2500);
}
</script>
</body>
</html>
